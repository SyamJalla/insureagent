<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsureAgent</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --line: #dde3ea; --text: #1c2733;
    --muted: #64748b; --accent: #0f6cbd; --accent-soft: #e3effa;
    --warn: #b45309; --warn-soft: #fef3c7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; }

  /* Login */
  #login-view { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px; width: 340px; }
  .card h1 { margin: 0 0 4px; font-size: 22px; }
  .card p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .card input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
  .card button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
  #login-error { color: #b91c1c; font-size: 13px; min-height: 18px; margin-top: 8px; }

  /* Chat */
  #chat-view { display: none; height: 100vh; grid-template-columns: 260px 1fr; }
  #sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #sidebar header { padding: 16px; border-bottom: 1px solid var(--line); }
  #who { font-size: 13px; }
  #who b { display: block; font-size: 14px; }
  #who span { color: var(--muted); }
  #new-conv { margin: 12px 16px; padding: 8px; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 8px; cursor: pointer; font-size: 13px; }
  #conv-list { flex: 1; overflow-y: auto; }
  .conv-item { padding: 10px 16px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-item.active { background: var(--accent-soft); }
  #logout { margin: 12px 16px; padding: 8px; border: 1px solid var(--line); background: none; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); }

  #main { display: flex; flex-direction: column; height: 100vh; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.escalated { border-color: var(--warn); background: var(--warn-soft); }
  .esc-tag { display: block; font-size: 11px; color: var(--warn); font-weight: 600; margin-bottom: 4px; }
  #thinking { align-self: flex-start; color: var(--muted); font-size: 13px; display: none; }
  #composer { display: flex; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--line); background: var(--panel); }
  #composer input { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
  #composer button { padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  #composer button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<div id="login-view">
  <form class="card" id="login-form">
    <h1>InsureAgent</h1>
    <p>Sign in to your insurance assistant</p>
    <input id="email" type="email" placeholder="Email" required autocomplete="username">
    <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Sign in</button>
    <div id="login-error"></div>
  </form>
</div>

<div id="chat-view">
  <div id="sidebar">
    <header><div id="who"><b></b><span></span></div></header>
    <button id="new-conv">+ New conversation</button>
    <div id="conv-list"></div>
    <button id="logout">Sign out</button>
  </div>
  <div id="main">
    <div id="messages"></div>
    <div id="thinking" style="padding:0 24px 8px">Assistant is thinking…</div>
    <form id="composer">
      <input id="input" placeholder="Ask about your policy, claims, or billing…" autocomplete="off">
      <button id="send" type="submit">Send</button>
    </form>
  </div>
</div>

<script>
const api = {
  token: null,
  async call(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: {
        "Content-Type": "application/json",
        ...(this.token ? { Authorization: "Bearer " + this.token } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401 && path !== "/auth/login") { showLogin(); throw new Error("unauthorized"); }
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    return res.json();
  },
};

let currentConv = null;

const $ = (id) => document.getElementById(id);

function showLogin() {
  api.token = null;
  try { sessionStorage.removeItem("token"); } catch (e) {}
  $("chat-view").style.display = "none";
  $("login-view").style.display = "flex";
}

async function showChat() {
  $("login-view").style.display = "none";
  $("chat-view").style.display = "grid";
  const me = await api.call("GET", "/me");
  $("who").querySelector("b").textContent = me.user.display_name;
  $("who").querySelector("span").textContent = me.user.role + (me.policy_count ? ` · ${me.policy_count} policies` : "");
  await refreshConversations(true);
}

async function refreshConversations(openFirst) {
  const convs = await api.call("GET", "/conversations");
  const list = $("conv-list");
  list.innerHTML = "";
  convs.forEach((c) => {
    const el = document.createElement("div");
    el.className = "conv-item" + (currentConv === c.conversation_id ? " active" : "");
    el.textContent = c.title;
    el.onclick = () => openConversation(c.conversation_id);
    list.appendChild(el);
  });
  if (openFirst) {
    if (convs.length) await openConversation(convs[0].conversation_id);
    else await newConversation();
  }
}

async function openConversation(id) {
  currentConv = id;
  const msgs = await api.call("GET", `/conversations/${id}/messages`);
  const pane = $("messages");
  pane.innerHTML = "";
  msgs.forEach(renderMessage);
  pane.scrollTop = pane.scrollHeight;
  refreshConversations(false);
}

async function newConversation() {
  const conv = await api.call("POST", "/conversations");
  currentConv = conv.conversation_id;
  $("messages").innerHTML = "";
  refreshConversations(false);
}

function renderMessage(m) {
  const el = document.createElement("div");
  el.className = `msg ${m.sender}` + (m.escalated ? " escalated" : "");
  if (m.escalated) {
    const tag = document.createElement("span");
    tag.className = "esc-tag";
    tag.textContent = "Connecting you to a human specialist";
    el.appendChild(tag);
  }
  el.appendChild(document.createTextNode(m.content));
  $("messages").appendChild(el);
}

$("login-form").onsubmit = async (e) => {
  e.preventDefault();
  $("login-error").textContent = "";
  try {
    const t = await api.call("POST", "/auth/login", { email: $("email").value, password: $("password").value });
    api.token = t.access_token;
    try { sessionStorage.setItem("token", t.access_token); } catch (err) {}
    await showChat();
  } catch (err) {
    $("login-error").textContent = err.message;
  }
};

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || !currentConv) return;
  $("input").value = "";
  renderMessage({ sender: "user", content: text, escalated: false });
  $("messages").scrollTop = $("messages").scrollHeight;
  $("send").disabled = true;
  $("thinking").style.display = "block";
  try {
    const reply = await api.call("POST", `/conversations/${currentConv}/messages`, { content: text });
    renderMessage(reply);
  } catch (err) {
    renderMessage({ sender: "assistant", content: "Something went wrong: " + err.message, escalated: false });
  } finally {
    $("send").disabled = false;
    $("thinking").style.display = "none";
    $("messages").scrollTop = $("messages").scrollHeight;
    refreshConversations(false);
  }
};

$("new-conv").onclick = newConversation;
$("logout").onclick = showLogin;

(function init() {
  let saved = null;
  try { saved = sessionStorage.getItem("token"); } catch (e) {}
  if (saved) { api.token = saved; showChat().catch(showLogin); }
})();
</script>
</body>
</html>

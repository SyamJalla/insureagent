context:
  input_text: "<USER_REQUEST_OR_TICKET_CONTENT>"

question:
  name: "insurance_request_classification"
  prompt: "Choose the first actionable department in the user's request. If the request spans multiple departments, choose the department needed for the first requested action. Use fallback only when no actionable department can be identified."

allowed_answers:
  billing: "Requests about bills, payments, amounts owed, or invoice due dates."
  policy: "Requests about insurance coverage, policy details, premiums, renewals, or endorsements."
  claims: "Requests about filing a claim, claim status, claim documents, or claim settlement."
  fallback: "Greetings, general insurance questions, or unclear requests that do not identify an actionable department."
